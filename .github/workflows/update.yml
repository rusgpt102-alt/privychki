name: Update weather and publish

on:
  schedule:
    # UTC. Local time in Yekaterinburg is UTC+5.
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.webmanifest'
      - '*.png'
      - '*.svg'
      - 'fetch.py'
      - 'tests/**'
      - '.github/workflows/update.yml'

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test weather collection and display
        run: |
          python -B -m unittest discover -s tests -v
          node --test tests/*.test.cjs
          node --check sw.js
      - name: Fetch public weather
        run: python -B fetch.py
      - name: Save data.json to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public weather data"
            git push origin HEAD:main
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html style.css app.js weather.js pwa.js sw.js data.json manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
